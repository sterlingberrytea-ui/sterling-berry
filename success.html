<!DOCTYPE html>
<html lang="en">
<head>
  <script src="content.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed | Sterling Berry Herbs & Teas</title>
  <meta name="robots" content="noindex"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream: #f9f5ef; --bark: #5c3d2e; --gold: #b8935a; --deep-sage: #4a6651; --muted: #8a8178; }
    body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--bark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; font-weight: 300; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-weight: 300; margin-bottom: 2rem; }
    .btn { display: inline-block; text-decoration: none; background: var(--bark); color: #fff; padding: 1rem 2.5rem; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; }
    #order-details { margin: 1.5rem 0; padding: 1.5rem; background: #fff; max-width: 480px; width: 100%; border-top: 3px solid var(--gold); text-align: left; }
  </style>
</head>
<body>
  <div class="icon">🍵</div>
  <h1>Order Confirmed</h1>
  <p id="success-msg">Thank you for your purchase! Your tea is on its way.</p>
  <div id="order-details" style="display:none"></div>
  <a href="/shop.html" class="btn">Continue Shopping</a>
  <script src="/nav.js"></script>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/get-session?session_id=${sessionId}`);
        const data = await res.json();
        if (data.customer_email) {
          document.getElementById('success-msg').textContent = `Thank you! A confirmation has been sent to ${data.customer_email}.`;
        }
        if (data.line_items?.length) {
          const details = document.getElementById('order-details');
          details.style.display = 'block';
          details.innerHTML = `'<h4 style="margin-bottom:1rem">Order Summary</h4>' + data.line_items.map(i => `<p>${i.description} x ${i.quantity}</p>`).join('');
        }
      } catch (e) { console.error(e); }
    })();
  </script>
</body>
</html>
