<!DOCTYPE html>
<html lang="en">
<head>
  <script src="content.js"></script>
  <script src="seo.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Sterling Berry Herbs & Teas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --cream: #f9f5ef; --bark: #5c3d2e; --gold: #b8935a; --deep-sage: #4a6651; --muted: #8a8178; --border: #e0d8cc; --warm-white: #fdfaf5; --gold-light: #d4b07a; }
body { font-family: Jost,sans-serif; background: var(--cream); color: #2c2c2c; overflow-x: hidden; min-height: 100vh; }
.contact-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; padding-top: 106px; }
.contact-left { background: var(--bark); padding: 6rem 5rem; display: flex; flex-direction: column; justify-content: center; }
.contact-left .eyebrow { font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 1rem; }
.contact-left h1 { font-family: Georgia,serif; font-size: clamp(2rem,3.5vw,3rem); font-weight: 300; color: #fff; line-height: 1.2; }
.contact-left h1 em { font-style: italic; color: var(--gold-light); }
.contact-left p { font-size: 0.9rem; line-height: 1.85; color: rgba(249,245,239,0.65); font-weight: 300; max-width: 380px; margin-top: 1.5rem; }
.contact-details { margin-top: 3rem; display: flex; flex-direction: column; gap: 1.2rem; }
.contact-detail { display: flex; align-items: flex-start; gap: 1rem; }
.contact-detail .icon { font-size: 1rem; width: 24px; flex-shrink: 0; }
.contact-detail-text { font-size: 0.82rem; color: rgba(249,245,239,0.6); line-height: 1.7; font-weight: 300; }
.contact-detail-text a { color: var(--gold-light); text-decoration: none; }
.contact-detail-text strong { display: block; color: rgba(249,245,239,0.85); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.2rem; font-weight: 400; }
.contact-right { background: var(--warm-white); padding: 6rem 5rem; display: flex; flex-direction: column; justify-content: center; }
.form-title { font-family: Georgia,serif; font-size: 1.5rem; font-weight: 400; color: var(--bark); margin-bottom: 0.4rem; }
.form-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 2.5rem; font-weight: 300; }
.form-group { margin-bottom: 1.4rem; }
.form-group label { display: block; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; font-weight: 400; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border); background: var(--cream); font-family: Jost,sans-serif; font-size: 0.88rem; outline: none; transition: border-color 0.3s; font-weight: 300; }
.form-group textarea { resize: vertical; min-height: 130px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-submit { width: 100%; padding: 1rem; background: var(--bark); color: #fff; border: none; cursor: pointer; font-family: Jost,sans-serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; transition: background 0.3s; margin-top: 0.5rem; }
.form-submit:hover:not(:disabled) { background: var(--deep-sage); }
.success-msg { display: none; text-align: center; padding: 2rem; background: rgba(74,102,81,0.08); border: 1px solid rgba(74,102,81,0.2); margin-top: 1rem; }
</style>
  <link rel="stylesheet" href="mobile.css"/>
</head>
<body>
<div class="contact-wrap">
  <div class="contact-left">
    <div class="eyebrow">Get In Touch</div>
    <h1 data-sb="contact.header.heading">Write <em>to us!</em></h1>
    <p>We'd love to hear from you. Write us and we will get back to you as soon as possible.</p>
    <div class="contact-details">
      <div class="contact-detail">
        <div class="icon">📍</div>
        <div class="contact-detail-text"><strong>Location</strong>Raleigh, NC, United States</div>
      </div>
      <div class="contact-detail">
        <div class="icon">✉️</div>
        <div class="contact-detail-text"><strong>Email</strong><a href="mailto:sterlingberrytea@gmail.com">sterlingberrytea@gmail.com</a></div>
      </div>
    </div>
  </div>
  <div class="contact-right">
    <div class="form-title">Send Us a Message</div>
    <div class="form-sub">We will get back to you as soon as possible!</div>
    <div id="contact-form">
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" placeholder="Jane" id="fname"/></div>
        <div class="form-group"><label>Last Name</label><input type="text" placeholder="Smith" id="lname"/></div>
      </div>
      <div class="form-group"><label>Email *</label><input type="email" placeholder="jane@example.com" id="email"/></div>
      <div class="form-group"><label>Subject</label><select id="subject"><option value="">Select a topic...</option><option>General Inquiry</option><option>Custom Blend</option><option>Order Question</option><option>Wholesale</option><option>Returns &amp; Refunds</option></select></div>
      <div class="form-group"><label>Message *</label><textarea placeholder="Tell us what's on your mind..." id="message"></textarea></div>
      <button class="form-submit" id="form-btn" onclick="submitForm()">Send Message →</button>
    </div>
    <div class="success-msg" id="success-msg"><h3>Thank you!</h3><p>We ve received your message.</p></div>
  </div>
</div>
<script src="nav.js"></script>
<script>
async function submitForm() {
  const f = (i) => document.getElementById(i).value.trim();
  const fname=f+'name'),email=f('email'),message=f('message'),subject=document.getElementById('subject').value;
  if(!fname||!email||!message)return;
  const btn=document.getElementById('form-btn');
  btn.disabled=true;btn.textContent='Sending...';
  try {
    const res=await fetch('/api/send-contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:f('fname'),lastName:f('lname'),email,subject,message})});
    const d=await res.json();
    if(d.ok){document.getElementById('contact-form').style.display='none';document.getElementById('success-msg').style.display='block';}
  }catch(err){btn.disabled=false;btn.textContent='Send Message ↚';}
}
</script>
<script src="animations.js"></script>
</body></html>
